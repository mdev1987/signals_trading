version = 1

# signals-trading — Pumpfun scanner Telegram listener (paper, 24/7).
#
# One channel, one lane. The deployed lane is the pre-registered
# `scanner_pumpfun_amm_tp50_quote_guard` variant (identical entry to the frozen
# `scanner_pumpfun_amm`). It keeps the +50 % take-profit but only takes it when
# a full-size sell quote still recovers the entry cost, sells when the
# executable quote drops below 0.50x entry cost, and salvages a disappeared
# full-size route through the exit-fraction ladder. The earlier
# `scanner_pumpfun_amm_tp50` lane keeps its own sample and recovery snapshot
# (447 closed trades); the two samples are never pooled. Evidence, the
# selection study and the fragility of that choice are in
# `docs/TP50_VARIANT.md`, `docs/EXIT_POLICY_STUDY.md` and
# `docs/QUOTE_GUARD_VARIANT.md`.
#
# The guard-only V1 pre-registration `scanner_pumpfun_amm_quote50`
# (docs/QUOTE_GUARD_VARIANT.md) is NOT deployed here. Run it manually only
# while observing the experiment; its sample is separate again.
#
#   channel  @AveSolanaTokenScanner   first card per mint (the channel re-posts
#                                    each pool ~3x; only the first is used)
#   filter   dex == Pumpfunamm  and  20,000 <= liquidity_usd < 100,000
#   entry    market buy on the first BUY print at/after the card + 5 s; retry
#            on later prints (at most one attempt per mint per second) and
#            give up at 60 s
#   exit     a mark >= entry x 1.50 is confirmed with a full-size sell quote:
#            sell 100 % only if that quote recovers >= 1.00x entry cost; sell
#            when the full-size quote falls below 0.50x entry cost (probed
#            every 15 s); when the full-size route disappears, walk the
#            0.5 / 0.25 / 0.1 / 0.01 ladder; otherwise hard sell at +5 min
#   size     0.1 SOL of a 10 SOL paper wallet; measured overlap is at most
#            9 open positions in any 5-minute window (median 2)
#
# The frozen entry convention (first BUY print, 5 s, 5-minute exit) was
# backtested at 97.2 % win, +22.0 % median over 1,818 trades, +44.6 SOL at
# 0.1 SOL marked; writing off the stale exit prints leaves +5.6 SOL (82.7 %
# win, +19.1 % median). The +50 % take-profit was selected on the two later
# out-of-sample days (982 trades): +1.76 SOL versus -5.11 SOL for the plain
# 5-minute exit at 60 s freshness, but that result is concentrated in three
# trades and turns negative under a 5 s freshness check. Treat this lane as a
# pre-registered experiment, not a validated edge.
#
# Do not widen the liquidity band or extend the hold past 5 minutes: the
# median token stops printing by minute 7, and 59 % of 15-minute exit marks
# are already over a minute stale (median 463 s). The AVE and DRBT feeds are
# retired. `channels.txt` is the research list and never changes what this app
# consumes: the channel is pinned on the command line below.
#
# Two modes, one binary:
#   --mode paper (this app)  read-only Jupiter /order quotes, never signs.
#   --mode live              signs with SOLANA_PRIVATE_KEY and broadcasts
#                            through Jupiter /execute. Requires BOTH
#                            --mode live and LIVE_TRADING_ENABLED=1.
#
# Slippage ladder: 50 -> 100 -> 200 -> 400 -> 800 -> 1000 bps, never above
# --max-slippage-bps. It escalates only `quote_no_route` and
# `quote_missing_out_amount`; a pool that is merely not indexed yet
# (`quote_not_ready`) is retried on a later print with a per-mint backoff, not
# by widening. Token decimals are resolved before routing, with a logged
# pump.fun 6-decimal fallback for mints Jupiter has not indexed. A rejected
# maxSupportedTransactionVersion is remembered for the process rather than
# re-sent at every ladder rung.
#
# To switch this app to live execution, change `--mode paper` to `--mode live`
# and set (never commit these):
#   SOLANA_PRIVATE_KEY=<base58 secret key>
#   SOLANA_RPC_URL=<rpc endpoint>
#   LIVE_TRADING_ENABLED=1
#   LIVE_MINT_ALLOWLIST=<optional comma-separated mints>
#   LIVE_STARTING_SOL=<wallet balance shown in reports>
#   LIVE_MAX_SLIPPAGE_BPS=1000
# The live path refuses A/B lanes, preflight sells, and any notional above
# --notional-sol. Fund it only after the paper gates in
# `docs/SCANNER_EVIDENCE.md`.
#
# What a paper run writes (output/paper/live_YYYYMMDD_HHMMSS/):
#   summary.json   scanner_cards / scanner_duplicates, feed_received/delivered,
#                  wallet.write_offs, open_positions, peak_rss_mb
#   entries.jsonl  quote_slippage_bps and quote_price_impact_pct actually paid
#   trades.jsonl   entry_delay_ms plus realized exits; exit_reason ==
#                  "no_route" is a write-off, not a mark
#   skips.jsonl    why a signal did not become a trade
# A forward run passes only with >=300 trades over >=5 days, positive realized
# PnL with a bootstrap lower bound above -5 % of starting capital, realized
# median >=+10 %, catastrophic exits (return_pct <= -0.90) under 16 %, and
# no_route write-offs under 16 % (details in the evidence doc). Entry guards:
# a card delivered more than --max-delivery-lag-ms after it was posted is
# skipped, and positions+pending entries are capped at
# --max-concurrent-positions. Leave --max-daily-loss-sol at 0 in paper: a cap
# would censor the forward sample the gates are measured on. For a funded run,
# a 1.0 SOL UTC-day cap (10 % of the 10 SOL bankroll) is a sensible backstop;
# it is a risk control, not part of the backtested edge.
#
# Restart continuity (paper only): every paper start writes
# output/recovery/scanner_pumpfun_amm_tp50_quote_guard_trade.sqlite3 (SQLite,
# WAL, synchronous=FULL) with the wallet, open positions, the original run
# directory, the run's original started_at, durable scanner counters and the
# set of processed Telegram/scanner ids (so a redelivered message or a reposted
# pool is not traded twice after a restart). A legacy `.json` snapshot from an
# older build is imported once and archived as `*.json.imported`.
# The command below ends with `--resume`, so an oxmgr restart (or a crash
# restart) continues the same run directory and keeps started_at, instead of
# opening a new timestamped sample. The flag is fail-closed: if the saved state
# is missing, corrupt, or written for a different strategy/guard configuration
# (execution convention, guards, exit settings, history bounds), the bot
# refuses to start rather than silently beginning a new sample.
#
# First install of a new sample: the snapshot does not exist yet, so `--resume`
# would refuse to start. Seed it by removing `--resume` for one start (or run
# `run_bot.sh` once without RESUME=1), let the bot write its first snapshot,
# then restore `--resume`. The earlier lanes' snapshots
# (scanner_pumpfun_amm_trade.sqlite3 and scanner_pumpfun_amm_tp50_trade.sqlite3)
# are different files and are left intact; switching RULE back resumes that
# sample instead. To start a *new* sample after the five-day gates are
# evaluated, stop the app and delete
# output/recovery/scanner_pumpfun_amm_tp50_quote_guard_trade.sqlite3 and its
# `.degraded` sidecar marker (and the old risk state if a different day should
# start clean). Never delete the snapshot unless you intend to end the current
# sample. A run whose summary says DEGRADED or INVALID is not valid for the
# gates: keep it paper-only and start a new sample.
#
# One-time setup:
#   cd /home/mdev/Programming/signals_trading
#   uv sync                              # .venv with bot dependencies
#   cp .env.example .env                 # Jupiter key + reporting bot token
#   cp config.ini.example config.ini     # Telethon api_id/api_hash/phone
#   env PYTHONPATH=src .venv/bin/python -m paper_bot login  # once, TTY
#
# Then:
#   oxmgr import ./oxfile.toml
#   oxmgr logs paper-bot -f
#   oxmgr status paper-bot

[[apps]]
name = "paper-bot"
# The package lives under `src/`, so PYTHONPATH is set here instead of
# installing the research repo as a wheel. `--no-sync` is unnecessary because
# this runs the venv directly, so a restart never touches the network.
command = "env PYTHONPATH=/home/mdev/Programming/signals_trading/src /home/mdev/Programming/signals_trading/.venv/bin/python -m paper_bot live --mode paper --rule scanner_pumpfun_amm_tp50_quote_guard --tp-pct 0.50 --quote-guard-ratio 0.50 --quote-guard-interval-ms 15000 --channel @AveSolanaTokenScanner --entry-mode trade --entry-delay-ms 5000 --max-entry-delay-ms 60000 --max-delivery-lag-ms 60000 --max-concurrent-positions 10 --entry-retry-backoff-ms 1000 --min-entry-quote-sol 0.01 --max-reference-age-ms 30000 --max-mark-age-ms 120000 --timer-late-tolerance-ms 1000 --max-future-skew-ms 5000 --risk-state-dir output/risk --horizon-min 5 --notional-sol 0.1 --starting-sol 10 --slippage-bps 50 --max-slippage-bps 1000 --priority-fee-lamports 2000 --jito-tip-lamports 10000 --fee 0.0125 --history-horizon-min 10 --history-max-mints 10000 --history-max-events-per-mint 3000 --history-max-total-events 150000 --tick-interval 1.0 --dex-interval 2.0 --memory-limit-mb 550 --memory-report-s 300 --shutdown-timeout-ms 25000 --resume"
cwd = "/home/mdev/Programming/signals_trading"
restart_policy = "always"
max_restarts = 100
# Stop after 5 crash-restarts inside 5 minutes instead of hot-looping.
crash_restart_limit = 5
restart_delay_secs = 10
stop_signal = "SIGTERM"
# Engine close (25 s) + reporter flush + Telethon disconnect.
stop_timeout_secs = 90
unified_logs = true

[apps.env]
PATH = "/home/mdev/.local/bin:/usr/local/bin:/usr/bin:/bin"
HOME = "/home/mdev"
PYTHONUNBUFFERED = "1"
PAPER_BOT_HOME = "/home/mdev/Programming/signals_trading"
PAPER_BOT_LOG_LEVEL = "INFO"
# Widest tolerance the quote-widening ladder may try (1000 = 10 %). The
# --max-slippage-bps flag on the command line wins; kept here so a live switch
# that drops the flag still fails safe.
LIVE_MAX_SLIPPAGE_BPS = "1000"
# Fail closed: live execution needs an explicit operator opt-in.
LIVE_TRADING_ENABLED = "0"
