[project]
name = "signals-trading"
version = "0.1.0"
description = "Point-in-time Solana signal research and the AVE hot-money Telegram bot"
readme = "docs/README.md"
requires-python = ">=3.14"
dependencies = [
    "base58>=2.1.1",
    "numpy>=2.5.4",
    "orjson>=3.13.0",
    "pandas>=3.1.1",
    "polars>=2.1.0",
    "pyarrow>=26.0.1",
    "python-telegram-bot>=22.8",
    "solders>=0.29.0",
    "telegramify-markdown>=1.4.2",
    "telethon>=1.45.0",
    "tgdata>=0.1.4",
    "websockets>=17.4",
    "zstandard>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
